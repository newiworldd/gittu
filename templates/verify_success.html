<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Status | Anik X Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0b0d;
            --bg-surface: #121418;
            --bg-card: #181b20;
            --border: rgba(255, 255, 255, 0.08);
            --primary: #2ecc71;
            --primary-glow: rgba(46, 204, 113, 0.25);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 10%, rgba(46, 204, 113, 0.08) 0%, transparent 60%);
        }
        .container {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 30px var(--primary-glow);
            position: relative;
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #2ecc71, #10b981, #3b82f6);
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(46, 204, 113, 0.12);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.2);
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--primary);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(46, 204, 113, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }
        .user-avatar-wrap {
            position: relative;
            width: 84px;
            height: 84px;
            margin: 0 auto 18px auto;
        }
        .user-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid var(--primary);
            object-fit: cover;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.3);
        }
        .check-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--primary);
            color: #000;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 800;
            border: 2px solid var(--bg-surface);
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 6px;
            color: #fff;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        .details-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 25px;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.88rem;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.06);
            padding-bottom: 8px;
        }
        .detail-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .detail-label {
            color: var(--text-muted);
        }
        .detail-val {
            color: #fff;
            font-weight: 600;
        }
        .role-pill {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid #3b82f6;
            padding: 2px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
        }
        .action-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .btn-discord {
            background: #5865F2;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            flex: 1;
            justify-content: center;
        }
        .btn-discord:hover {
            background: #4752c4;
            transform: translateY(-2px);
        }
        .btn-close {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-close:hover {
            background: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-badge">
            <span class="pulse-dot"></span>
            VERIFICATION COMPLETED
        </div>

        <div class="user-avatar-wrap">
            <img src="{{ user_avatar or 'https://cdn.discordapp.com/embed/avatars/0.png' }}" alt="User Avatar" class="user-avatar">
            <div class="check-badge">✓</div>
        </div>

        <h1>Access Granted!</h1>
        <p class="subtitle">Your Discord account has been verified successfully.</p>

        <div class="details-box">
            <div class="detail-row">
                <span class="detail-label">👤 User:</span>
                <span class="detail-val">@{{ username }}</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">🏰 Server:</span>
                <span class="detail-val">{{ server_name }}</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">🎭 Role Assigned:</span>
                <span class="role-pill">@{{ role_name or 'Verified' }}</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">🛡️ Security Status:</span>
                <span class="detail-val" style="color: #2ecc71;">● Protected & Backed Up</span>
            </div>
        </div>

        <div class="action-btns">
            <a href="https://discord.com/channels/@me" class="btn-discord" id="discord-btn">
                <svg width="20" height="15" viewBox="0 0 71 55" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M60.1 4.9C55.6 2.8 50.7 1.3 45.6 0.4C45.5 0.4 45.4 0.5 45.3 0.6C44.7 1.8 44 3.2 43.5 4.4C37.9 3.5 32.4 3.5 26.9 4.4C26.4 3.1 25.7 1.8 25.1 0.6C25 0.5 24.9 0.4 24.8 0.4C19.7 1.3 14.8 2.8 10.3 4.9C10.2 4.9 10.1 5 10.1 5.1C0.9 18.8 -1.6 32.1 0.8 45.2C0.8 45.3 0.9 45.4 1 45.5C7.1 50 13 52.7 18.8 54.5C18.9 54.5 19.1 54.5 19.2 54.3C20.6 52.4 21.8 50.3 22.8 48.1C22.9 47.9 22.8 47.7 22.6 47.6C20.6 46.8 18.8 45.8 17 44.7C16.8 44.6 16.8 44.3 17 44.1C17.4 43.8 17.8 43.5 18.1 43.2C18.2 43.1 18.3 43.1 18.4 43.1C30 48.4 42.5 48.4 53.9 43.1C54 43.1 54.1 43.1 54.2 43.2C54.5 43.5 54.9 43.8 55.3 44.1C55.5 44.3 55.5 44.6 55.3 44.7C53.5 45.8 51.6 46.8 49.7 47.6C49.5 47.7 49.4 47.9 49.5 48.1C50.5 50.3 51.7 52.4 53.1 54.3C53.2 54.5 53.4 54.5 53.5 54.5C59.3 52.7 65.2 50 71.3 45.5C71.4 45.4 71.5 45.3 71.5 45.2C74.4 27.9 66.8 14.8 60.3 5.1C60.3 5 60.2 4.9 60.1 4.9ZM23.7 37.1C20.2 37.1 17.3 33.9 17.3 29.9C17.3 25.9 20.1 22.7 23.7 22.7C27.3 22.7 30.2 25.9 30.1 29.9C30.1 33.9 27.3 37.1 23.7 37.1ZM47.7 37.1C44.2 37.1 41.3 33.9 41.3 29.9C41.3 25.9 44.1 22.7 47.7 22.7C51.3 22.7 54.2 25.9 54.1 29.9C54.1 33.9 51.3 37.1 47.7 37.1Z" fill="white"/>
                </svg>
                Open Discord
            </a>
            <button class="btn-close" onclick="window.close()">Close</button>
        </div>

        <div style="margin-top: 22px; font-size: 0.85rem; color: #9ca3af; font-family: 'JetBrains Mono', monospace;">
            <p>⏱️ Auto-redirecting to Discord in <strong id="timer" style="color: #2ecc71;">3</strong>s...</p>
            <div style="width: 100%; height: 4px; background: rgba(255,255,255,0.08); border-radius: 4px; margin-top: 8px; overflow: hidden;">
                <div id="progress" style="width: 100%; height: 100%; background: #2ecc71; transition: width 3s linear;"></div>
            </div>
        </div>
    </div>

    <script>
        let seconds = 3;
        const timerEl = document.getElementById('timer');
        const progressEl = document.getElementById('progress');
        
        setTimeout(() => {
            if (progressEl) progressEl.style.width = '0%';
        }, 50);

        const countdown = setInterval(() => {
            seconds--;
            if (timerEl) timerEl.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(countdown);
                window.location.href = "discord://";
                setTimeout(() => {
                    window.location.href = "https://discord.com/channels/@me";
                }, 700);
            }
        }, 1000);
    </script>
</body>
</html>
