<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Successful | Anik X Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0f1012;
            --bg-surface: #18191c;
            --border: rgba(255, 255, 255, 0.08);
            --primary: #2ecc71;
            --text-main: #f2f3f5;
            --text-muted: #949ba4;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'JetBrains Mono', monospace;
        }
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            background: rgba(46, 204, 113, 0.15);
            border: 2px solid var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            font-size: 2.2rem;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #fff;
        }
        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .user-tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: 8px;
            display: inline-block;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 25px;
        }
        .close-btn {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .close-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-circle">🛡️</div>
        <h1>Verification Successful!</h1>
        <div class="user-tag">@{{ username }}</div>
        <p>Your Discord account has been verified and granted access to <strong>{{ server_name }}</strong>. All server channels are now unlocked for you.</p>
        <p style="font-size:0.8rem; color:#6b7280;">You may safely close this tab and return to Discord.</p>
        <button class="close-btn" onclick="window.close()">Return to Discord</button>
    </div>
</body>
</html>
